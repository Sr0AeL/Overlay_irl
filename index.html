<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overlay IRL</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    .overlay {
      width: 100%;
      height: 100%;
      position: relative;
    }

    .titulo {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 10px 18px;
      background: rgba(0, 0, 0, 0.75);
      color: white;
      font-family: Arial, sans-serif;
      font-size: 28px;
      font-weight: bold;
      border-radius: 8px;
    }
  </style>
</head>

<body>
  <div class="overlay">
    <div class="titulo">OVERLAY IRL</div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Overlay IRL</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .titulo {
      position: absolute;
      z-index: 1000;
      top: 20px;
      left: 20px;

      padding: 10px 18px;

      background: rgba(0, 0, 0, 0.75);
      color: white;

      font-family: Arial, sans-serif;
      font-size: 28px;
      font-weight: bold;

      border-radius: 8px;
    }
  </style>
</head>

<body>

  <div id="map"></div>

  <div class="titulo">
    OVERLAY IRL
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const map = L.map('map').setView([-23.5505, -46.6333], 13);

    L.tileLayer(
      'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      {
        attribution: '&copy; OpenStreetMap'
      }
    ).addTo(map);

    L.marker([-23.5505, -46.6333])
      .addTo(map)
      .bindPopup('Minha localização')
      .openPopup();
  </script>

</body>
</html>
